[project]
name = "peerxiv"
version = "0.7.2"
description = "An archive-first research network with a CoU classification layer."
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4,<5",
  "Flask-SocketIO>=5.5,<6",
  "Flask-Limiter>=4.1,<5",
  "pydantic>=2.11,<3",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "python-dotenv>=1.1,<2",
  "simple-websocket>=1.1,<2",
  "gunicorn>=23,<24",
  "pypdf>=6.15,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["client"]
testpaths = ["tests"]
