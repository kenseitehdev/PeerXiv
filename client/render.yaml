previews:
  generation: off

services:
  - type: web
    name: peerxiv-alpha
    runtime: docker
    plan: standard
    region: oregon
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/ready
    preDeployCommand: cd /app/client && python -m flask --app server db upgrade
    maxShutdownDelaySeconds: 30
    disk:
      name: manuscripts
      mountPath: /data/manuscripts
      sizeGB: 5
    envVars:
      - key: PEERXIV_ENV
        value: production
      - key: PEERXIV_SECRET_KEY
        generateValue: true
      - key: PEERXIV_REGISTRATION_MODE
        value: invite
      - key: PEERXIV_ALPHA_INVITE_CODE
        generateValue: true
      - key: PEERXIV_PROXY_FIX
        value: "1"
      - key: PEERXIV_MANUSCRIPT_STORAGE_ROOT
        value: /data/manuscripts
      - key: PEERXIV_MALWARE_SCAN_REQUIRED
        value: "1"
      - key: PEERXIV_CLAMAV_HOST
        fromService:
          type: pserv
          name: peerxiv-clamav
          property: host
      - key: PEERXIV_CLAMAV_PORT
        value: "3310"
      - key: PEERXIV_RUN_MIGRATIONS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: peerxiv-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: peerxiv-key-value
          property: connectionString

  - type: pserv
    name: peerxiv-clamav
    runtime: image
    plan: pro
    region: oregon
    numInstances: 1
    image:
      url: docker.io/clamav/clamav:1.5
    disk:
      name: clamav-signatures
      mountPath: /var/lib/clamav
      sizeGB: 1

  - type: keyvalue
    name: peerxiv-key-value
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: peerxiv-postgres
    databaseName: peerxiv
    user: peerxiv
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
